<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    
    <style>
        .messages { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .message { padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid; font-size: 0.9em; font-weight: bold; text-align: left; }
        .message.error { background-color: #3f2222; color: #fecaca; border-color: #ef4444; }
        .message.success { background-color: #1e3a2c; color: #bbf7d0; border-color: #22c55e; }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Registro</h1>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}

            <label for="tipo_usuario">Tipo de usuario:</label>
            <select name="tipo_usuario" id="tipo_usuario">
                <option value="Cliente" {% if tipo_usuario_seleccionado == 'Cliente' %}selected{% endif %}>
                    Cliente
                </option>
                <option value="Mecanico" {% if tipo_usuario_seleccionado == 'Mecanico' %}selected{% endif %}>
                    Mecánico
                </option>
            </select>

            <div id="datos_cuenta">
                <h3>Datos de la Cuenta</h3>
                {{ user_form.as_p }}
            </div>

            <div id="datos_cliente" style="{% if tipo_usuario_seleccionado != 'Cliente' %}display:none;{% endif %}">
                <h3>Datos del Cliente</h3>
                {{ cliente_form.as_p }}
            </div>

            <div id="datos_mecanico" style="{% if tipo_usuario_seleccionado != 'Mecanico' %}display:none;{% endif %}">
                <h3>Datos del Mecánico</h3>
                {{ mecanico_form.as_p }}
            </div>

            <button type="submit">Registrar</button>
        </form>

        <p><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
    </div>

    <script>
        const tipoSelect = document.getElementById('tipo_usuario');
        const datosCliente = document.getElementById('datos_cliente');
        const datosMecanico = document.getElementById('datos_mecanico'); 

        function mostrarCampos() {
            const tipo = tipoSelect.value;
            if (tipo === 'Cliente') {
                datosCliente.style.display = 'block';
                datosMecanico.style.display = 'none';
            } else if (tipo === 'Mecanico') {
                datosCliente.style.display = 'none';
                datosMecanico.style.display = 'block'; 
            }
        }
        tipoSelect.addEventListener('change', mostrarCampos);
    </script>
</body>
</html>
